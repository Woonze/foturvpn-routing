name: Update GeoIP and Geosite links

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Refresh dataset links and deeplinks
        run: python3 scripts/update_geodata.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "GeoIP and Geosite releases are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HAPP INCY
          git commit -m "Обновить ссылки GeoIP и Geosite"
          git push
